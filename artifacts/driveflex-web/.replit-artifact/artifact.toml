kind = "web"
previewPath = "/"
title = "Drive Flex"
description = "A premium car-rental marketplace for discovering verified vehicles, exploring trusted owners, and previewing date-based bookings."
version = "1.0.0"
id = "artifacts/driveflex-web"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/_next", "/_next/hmr" ]
localPort = 21121

[services.development]
run = "pnpm --filter @workspace/driveflex-web run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/driveflex-web", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/driveflex-web", "run", "serve" ]

[services.env]
PORT = "21121"
BASE_PATH = "/"

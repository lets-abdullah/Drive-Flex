kind = "web"
previewPath = "/"
title = "Drive Flex"
description = "A premium car-rental marketplace for discovering verified vehicles, exploring trusted owners, and previewing date-based bookings."
version = "1.0.0"
id = "artifacts/driveflex-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21121

[services.development]
run = "pnpm --filter @workspace/driveflex-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driveflex-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/driveflex-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21121"
BASE_PATH = "/"
